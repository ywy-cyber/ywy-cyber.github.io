# ═══════════════════════════════════════════════════════════════
#  Hugo 站点配置 —— 双语（中文默认 / 英文）
#  主题：PaperMod（web前端/themes/PaperMod）
#  部署：GitHub Actions → https://ywy-cyber.github.io/
# ═══════════════════════════════════════════════════════════════

baseURL: "https://ywy-cyber.github.io/"
theme: "PaperMod"
title: "应忘幽"

# 中文为默认语言；两种语言都放在子目录（/zh/、/en/），根路径自动跳转
defaultContentLanguage: "zh"
defaultContentLanguageInSubdir: false

enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

pagination:
    pagerSize: 8

taxonomies:
    tag: tags

outputs:
    home:
        - HTML
        - RSS
        - JSON

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        noClasses: false

params:
    env: "production"
    author: "应忘幽"
    defaultTheme: "auto"
    ShowReadingTime: true
    ShowWordCount: false
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowToc: true
    TocOpen: false
    ShowRssButtonInSectionTermList: true
    ShowAllPagesInArchive: true
    DateFormat: "2006-01-02"
    mainSections:
        - posts
    disableThemeToggle: false
    disableLangToggle: false
    displayFullLangName: true
    socialIcons:
        - name: "github"
          url: "https://github.com/ywy-cyber"
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys:
            - title
            - permalink
            - summary
            - content
    assets:
        disableFingerprinting: false

languages:
    zh:
        label: "中文"
        locale: "zh-CN"
        contentDir: "content/zh"
        weight: 1
        title: "应忘幽"
        params:
            description: "应忘幽 —— 人工智能安全方向的研究与工程笔记。"
            label:
                text: "应忘幽"
            homeInfoParams:
                Title: "应忘幽"
                Content: >
                    做人工智能安全研究：大模型的攻与防、模型可解释性，
                    以及把这些东西落成能跑起来的工程。
                    这里放研究方向、公开项目与工作笔记，不写机构与署名。
        menu:
            main:
                - name: "文章"
                  url: "posts/"
                  weight: 10
                - name: "项目"
                  url: "projects/"
                  weight: 20
                - name: "标签"
                  url: "tags/"
                  weight: 30
                - name: "关于"
                  url: "about/"
                  weight: 40
                - name: "搜索"
                  url: "search/"
                  weight: 50
    en:
        label: "English"
        locale: "en"
        contentDir: "content/en"
        weight: 2
        title: "Ian Wayne"
        params:
            description: "Ian Wayne — research and engineering notes on AI security."
            author: "Ian Wayne"
            label:
                text: "Ian Wayne"
            homeInfoParams:
                Title: "Ian Wayne"
                Content: >
                    I work on AI security: attacks and defenses on large models,
                    model interpretability, and turning both into systems that run.
                    This site keeps my research directions, public projects and notes —
                    no institutions, no bylines.
        menu:
            main:
                - name: "Posts"
                  url: "posts/"
                  weight: 10
                - name: "Projects"
                  url: "projects/"
                  weight: 20
                - name: "Tags"
                  url: "tags/"
                  weight: 30
                - name: "About"
                  url: "about/"
                  weight: 40
                - name: "Search"
                  url: "search/"
                  weight: 50
