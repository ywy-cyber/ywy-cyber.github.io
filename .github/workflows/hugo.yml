# 构建 Hugo 站点并发布到 GitHub Pages
# 触发：推送到 main 分支，或手动 workflow_dispatch
name: Deploy Hugo site to Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    HUGO_VERSION: "0.169.0"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # 不走 peaceiris/actions-hugo：它从 github.com/.../releases/download/ 下载，
            # 该链路故障时返回 504（2026-11-09 实测）。这里改用 REST API 的 asset 端点
            # 取签名直链，再下载解包——只经过 api.github.com 与 release-assets.githubusercontent.com。
            - name: Install Hugo (bypass broken release download)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  NAME="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  API="https://api.github.com/repos/gohugoio/hugo/releases/tags/v${HUGO_VERSION}"

                  ASSET_ID=$(curl -fsSL \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "${API}" \
                      | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['id'] for a in d['assets'] if a['name']=='${NAME}'))")
                  echo "asset id: ${ASSET_ID}"

                  DIRECT_URL=$(curl -fsSL -o /dev/null -w '%{redirect_url}' \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/octet-stream" \
                      "https://api.github.com/repos/gohugoio/hugo/releases/assets/${ASSET_ID}")
                  echo "direct url acquired (signed, not printed)"

                  curl -fsSL "${DIRECT_URL}" -o /tmp/hugo.tar.gz
                  ls -l /tmp/hugo.tar.gz
                  sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
                  hugo version

            - name: Build site
              run: hugo --minify --gc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
