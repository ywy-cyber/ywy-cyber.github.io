# 构建 Hugo 站点并发布到 GitHub Pages
# 触发：推送到 main 分支，或手动 workflow_dispatch
name: Deploy Hugo site to Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    HUGO_VERSION: "0.169.0"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # 不走 peaceiris/actions-hugo：它从 github.com/.../releases/download/ 下载，
            # 该链路故障时返回 504（2026-11-09 实测）。.github/scripts/install_hugo.py
            # 改走 REST API 的 asset 端点取签名直链，只经过 api.github.com
            # 与 release-assets.githubusercontent.com。
            - name: Install Hugo (bypass broken release download)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  python3 .github/scripts/install_hugo.py
                  hugo version

            - name: Build site
              run: hugo --minify --gc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
