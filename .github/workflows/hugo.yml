# 构建 Hugo 站点并发布到 GitHub Pages
# 触发：推送到 main 分支，或手动 workflow_dispatch
name: Deploy Hugo site to Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.169.0"
                  extended: true

            - name: Build site
              run: hugo --minify --gc

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
